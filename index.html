/* Continuous masked carousel */
.carousel-viewport {
  width: min(100%, 660px);
  height: 370px;
  overflow: hidden;
  position: relative;
  margin: 35px auto;
  isolation: isolate;
  /* The mask clips the row while revealing the neighboring images. */
  -webkit-mask-image: linear-gradient(to right, transparent, black 6%, black 94%, transparent);
  mask-image: linear-gradient(to right, transparent, black 6%, black 94%, transparent);
}
.carousel-track {
  display: flex;
  align-items: center;
  gap: 18px;
  width: max-content;
  height: 100%;
  will-change: transform;
}
.carousel-item {
  flex: 0 0 210px;
  height: 210px;
  position: relative;
  z-index: 0;
}
.carousel-item img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 0px;
  transition: transform .3s ease, box-shadow .3s ease;
  transform-origin: center;
}
.carousel-item:hover { z-index: 2; }
.carousel-item:hover img {
  transform: scale(1.3);
  box-shadow: 0 12px 28px rgba(0,0,0,.35);
}
@media (max-width: 700px) {
  .carousel-viewport { height: 220px; }
  .carousel-item { flex-basis: 160px; height: 160px; }
}
		/* Additional horizontal scroll section */

}

}

.scroll-gallery-item .image-caption {

}

}

/* =================================
   AUTOMATIC VERTICAL SIDE CAROUSELS
   ================================= */

.side-carousel {
    position: fixed;
    top: 0;
    bottom: 0;
    width: clamp(90px, 8vw, 140px);
    overflow: hidden;
    z-index: 5;
    pointer-events: none;
}

/* Keep the carousels beside the main content */
.side-carousel.left {
    left: 1vw;
}

.side-carousel.right {
    right: 1vw;
}

.side-carousel-track {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    height: max-content;
    will-change: transform;
    animation: side-scroll 40s linear infinite;
}

/* Make the right side move in the opposite direction */
.side-carousel.right .side-carousel-track {
    animation-direction: reverse;
}

.side-carousel-item {
    flex: 0 0 clamp(90px, 8vw, 140px);
    width: 100%;
    height: clamp(90px, 8vw, 140px);
}

.side-carousel-item img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Continuous loop */
@keyframes side-scroll {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-50%);
    }
}

/* Hide on smaller screens */
@media (max-width: 1000px) {
    .side-carousel {
        display: none;
    }
}

        padding: 20px;

	<script>
$(function () {

    $('.side-carousel').each(function () {

        const $track = $(this).find('.side-carousel-track');

        // Save the original pictures
        const images = $track.children().toArray();

        // Shuffle the pictures randomly
        function shuffle(array) {

            const shuffled = [...array];

            for (let i = shuffled.length - 1; i > 0; i--) {

                const j = Math.floor(Math.random() * (i + 1));

                [shuffled[i], shuffled[j]] =
                [shuffled[j], shuffled[i]];

            }

            return shuffled;
        }

        // Create a randomized sequence
        const firstShuffle = shuffle(images);

        // Duplicate the shuffled sequence for continuous scrolling
        const secondShuffle = shuffle(images);

        // Empty the original track
        $track.empty();

        // Add the randomized pictures
        [...firstShuffle, ...secondShuffle].forEach(function (image) {

            $track.append(image);

        });

    });

});
</script>

        $('<p></p>')
